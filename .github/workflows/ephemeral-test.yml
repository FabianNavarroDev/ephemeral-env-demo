name: Ambiente efimero de pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar la aplicacion
        run: |
          npm start &
          sleep 5

      - name: Probar ruta principal
        run: curl -f http://localhost:3000/

      - name: Probar ruta de salud
        run: curl -f http://localhost:3000/health